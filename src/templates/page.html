<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{page.title}}</title>
    <style>
      @@STYLES@@;
    </style>
  </head>
  <body>
    @@PARTIAL:header@@
    <main>
      <nav class="tabs" role="tablist" aria-label="{{page.tabsLabel}}">
        <button
          id="tab-today"
          type="button"
          role="tab"
          data-tab="today"
          aria-controls="panel-today"
          aria-selected="true"
          tabindex="0"
        >
          {{page.tabToday}}</button
        ><button
          id="tab-calendar"
          type="button"
          role="tab"
          data-tab="calendar"
          aria-controls="panel-calendar"
          aria-selected="false"
          tabindex="-1"
        >
          {{page.tabCalendar}}</button
        ><button
          id="tab-method"
          type="button"
          role="tab"
          data-tab="method"
          aria-controls="panel-method"
          aria-selected="false"
          tabindex="-1"
        >
          {{page.tabHelp}}
        </button>
      </nav>
      @@PARTIAL:today@@@@PARTIAL:calendar@@ @@PARTIAL:method@@

      <noscript>{{page.noscript}}</noscript>
    </main>
    <footer>{{page.footer}}</footer>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-close">
        <button class="close" data-close-dialog aria-label="{{details.close}}">×</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <script type="application/json" id="database">
      @@DATABASE@@
    </script>
    <script>
      @@APP_JS@@
    </script>
  </body>
</html>
