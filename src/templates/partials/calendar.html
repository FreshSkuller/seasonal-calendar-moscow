<section data-panel="calendar" hidden>
  <div class="toolbar calendar-toolbar">
    <div class="product-type-filter" role="group" aria-label="{{page.productTypeLabel}}">
      <div class="product-type-heading">
        <span class="filter-label">{{page.productTypeLabel}}</span>
        <button id="reset" type="button" hidden>{{page.calendarReset}}</button>
      </div>
      <div class="product-type-options">
        <button data-product-type="" aria-pressed="true">{{page.productTypes.all}}</button>
        <button data-product-type="vegetable" aria-pressed="false">
          {{page.productTypes.vegetable}}
        </button>
        <button data-product-type="fruit" aria-pressed="false">{{page.productTypes.fruit}}</button>
        <button data-product-type="berry" aria-pressed="false">{{page.productTypes.berry}}</button>
      </div>
    </div>
    <div class="calendar-primary">
      <div class="search-control search-field">
        <label class="field" for="search">{{page.searchLabel}}</label>
        <div class="search-input-wrap">
          <input type="search" id="search" placeholder="{{page.calendarPlaceholder}}" />
          <button id="calendar-clear-search" type="button" aria-label="{{page.clearSearch}}" hidden>
            ×
          </button>
        </div>
      </div>
      <label class="field origin-field"
        >{{page.originLabel}}<select id="origin">
          <option value="">{{page.allOrigins}}</option>
        </select></label
      >
      <label class="field month-field">{{page.monthLabel}}<select id="month"></select></label>
      <div class="segmented" role="group" aria-label="{{page.calendarViewLabel}}">
        <button id="focus-view" aria-pressed="true">
          <span class="period-long">{{page.threeMonths}}</span
          ><span class="period-short">{{page.threeMonthsShort}}</span></button
        ><button id="year-view" aria-pressed="false">
          <span class="period-long">{{page.wholeYear}}</span
          ><span class="period-short">{{page.wholeYearShort}}</span>
        </button>
      </div>
    </div>
    <details class="calendar-more" id="calendar-more" open>
      <summary>{{page.moreFilters}} <span id="calendar-filter-count" hidden></span></summary>
      <div class="calendar-secondary">
        <label class="field"
          >{{page.statusLabel}}<select id="status">
            <option value="">{{page.allStatuses}}</option>
          </select></label
        >
        <label class="field"
          >{{page.sortLabel}}<select id="sort">
            <option value="season">{{page.sortSeason}}</option>
            <option value="name">{{page.sortName}}</option>
          </select></label
        >
        <label class="check-option"
          ><input type="checkbox" id="favorites" />{{page.onlyFavorites}}</label
        ><label class="check-option"
          ><input type="checkbox" id="known-only" />{{page.knownOnly}}</label
        >
      </div>
    </details>
  </div>
  <div class="summary-line">
    <h1 id="month-title"></h1>
    <span id="result-count" aria-live="polite"></span>
  </div>
  <div class="legend" id="legend-items" tabindex="0"></div>
  <div class="table-wrap">
    <table aria-label="{{page.tableLabel}}">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <p class="scope-note">{{page.legendIntro}}<b>{{page.legendUnknown}}</b>{{page.legendAction}}</p>
  <p class="coverage" id="coverage"></p>
  <p class="fine">{{page.dateScope}}</p>
</section>
