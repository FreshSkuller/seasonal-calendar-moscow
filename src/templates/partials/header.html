<header>
  <div class="topline">
    <div class="brand">{{page.brand}}</div>
    <div class="stamp">
      {{page.checked}}<button id="theme" aria-label="{{page.themeLabel}}" aria-pressed="false">
        {{page.themeSymbol}}
      </button>
    </div>
  </div>
  <div class="hero">
    <div>
      <h1>{{page.heroTitle}}</h1>
      <p>{{page.heroIntro}}<br />{{page.heroAction}}</p>
    </div>
    <div class="number-note">
      <strong id="hero-count"></strong>{{page.countDescription}}<br />{{page.countSources}}
    </div>
  </div>
</header>
